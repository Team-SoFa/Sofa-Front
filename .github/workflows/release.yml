name: Linkiving frontend release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: vercel-release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag commit is on main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tag ${TAG_NAME} must point to a commit on main." >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.19.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build production artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy staged production to Vercel
        id: deploy
        shell: bash
        run: |
          deployment_url="$(vercel deploy --prebuilt --archive=tgz --prod --skip-domain --token=${{ secrets.VERCEL_TOKEN }})"
          echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"
          {
            echo "Staged production release deployed."
            echo
            echo "- Tag: ${TAG_NAME}"
            echo "- URL: ${deployment_url}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Promote deployment to production
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          vercel promote "${DEPLOYMENT_URL}" --yes --timeout=5m --token=${{ secrets.VERCEL_TOKEN }}
          vercel inspect "${DEPLOYMENT_URL}" --token=${{ secrets.VERCEL_TOKEN }}
          {
            echo
            echo "Production release promoted."
            echo
            echo "- URL: ${DEPLOYMENT_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build release notes from changelog
        shell: bash
        run: |
          awk -v tag="${TAG_NAME}" '
            $0 == "## [" tag "]" || $0 ~ "^## \\[" tag "\\] " {
              capture = 1
              next
            }
            capture && /^## \[/ {
              exit
            }
            capture {
              print
            }
          ' CHANGELOG.md | sed '/^[[:space:]]*$/d' > release-notes.md

          if [ ! -s release-notes.md ]; then
            {
              echo "Could not find release notes for ${TAG_NAME} in CHANGELOG.md."
              echo "Please add a ## [${TAG_NAME}] section before creating the tag."
            } >&2
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
